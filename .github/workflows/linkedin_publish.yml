# Publication automatique LinkedIn — un post par semaine (lundi 8h UTC)
#
# Secrets GitHub à configurer dans Settings > Secrets and variables > Actions :
#   LINKEDIN_ACCESS_TOKEN  — OAuth 2.0 token avec le scope w_member_social
#   LINKEDIN_PERSON_ID     — Votre person ID LinkedIn (champ "sub" de /v2/userinfo)
#
# Déclenchement manuel possible via l'onglet Actions > Run workflow

name: Publish LinkedIn Post

on:
  schedule:
    - cron: "0 8 * * 1"  # Chaque lundi à 8h00 UTC
  workflow_dispatch:      # Déclenchement manuel depuis GitHub Actions

jobs:
  publish:
    name: Publish next LinkedIn post
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Nécessaire pour commiter posts_status.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: python scripts/linkedin_publisher.py

      - name: Commit updated posts_status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts_status.json
          git diff --staged --quiet || git commit -m "chore: mark post as published [skip ci]"
          git push
